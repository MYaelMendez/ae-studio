<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🍱 OMNIPROMPT · æ Studio</title><style>
:root{color-scheme:dark;font:16px system-ui;background:#07090d;color:#f3ead4}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:16px}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#1a232b;border:1px solid #66583b;border-radius:12px;padding:12px}button[aria-pressed=true]{border-color:#e4bc65;background:#363323}button:focus-visible,textarea:focus-visible{outline:3px solid #5ff2cf;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}.widget{width:min(100%,440px);background:#11171d;border:1px solid #80663b;border-radius:22px;padding:16px;display:grid;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading{color:#e4bc65;font-weight:700}.muted{font-size:.82rem;color:#b4c1c8}.panel{background:#1c262d;padding:14px;border-radius:12px}.toggle,.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.modules button{text-align:left;min-height:70px}.modules small{display:block;color:#bdc7ca;margin-top:5px}textarea{width:100%;min-height:96px;padding:12px;background:#1c262d;color:inherit;border:1px solid #63737c;border-radius:12px;resize:vertical}.controls{display:grid;gap:10px}.summary{display:none;text-align:center}.square .controls{display:none}.square .summary{display:block}.square .modules button{min-height:60px}.square .panel{padding:10px}.primary{background:#cba24d;color:#081015;font-weight:700}.notice{min-height:1.5em}.widget.square{max-width:440px}@media(max-width:340px){body{padding:6px}.widget{padding:10px}} </style></head><body>
<main class="widget" id="widget"><header class="row"><div><div class="heading">🍱 OMNIPROMPT://</div><div class="muted">æ Studio · OpenAI</div></div><span id="ratio">9:16</span></header>
<nav class="toggle" aria-label="Widget view"><button id="portrait" aria-pressed="true">▯ Workspace</button><button id="square" aria-pressed="false">□ Squarepost</button></nav>
<section class="panel"><strong>❤️ HUMAN://ROOT</strong><div class="muted">One network · One human principal</div></section>
<section class="summary"><strong>ONE INTENT · MANY CAPABILITIES</strong><p id="summary">Human intent powers the network.</p></section>
<section class="controls"><label class="heading" for="intent">01 · INTENT</label><textarea id="intent" placeholder="What should the network accomplish?"></textarea></section>
<section><div class="heading" style="margin-bottom:8px">02 · MIXTURE OF WIDGETS</div><div class="modules" id="modules"></div></section>
<section class="controls panel"><div class="heading">03 · PRINCIPAL REVIEW</div><div id="status" class="muted">Draft · not reviewed</div><button id="review" class="primary">Review draft</button><button id="copy" disabled>Copy reviewed omniprompt</button><div id="notice" class="muted notice" role="status"></div></section>
<footer class="muted">🔒 Context may propagate; authority does not. · Local prototype v0.1</footer></main>
<script>
"use strict";
const defs=[["studio","æ Studio","Composition"],["store","LLM.store","Capabilities"],["teologia","TEOLOGIA","Education"],["sovereign","SOV-REIGN","Evidence"]];
const state={mode:"portrait",intent:"",selected:new Set(defs.map(x=>x[0])),reviewed:null};
const el=id=>document.getElementById(id);
const payload=()=>JSON.stringify({schema:"aewidgets/draft-0.1",principal:"HUMAN://ROOT",platform:"OpenAI",intent:state.intent.trim(),modules:defs.filter(x=>state.selected.has(x[0])).map(x=>x[1]),authority:"not-granted",connections:"unverified",execution:"not-requested"},null,2);
function invalidate(){state.reviewed=null;el("copy").disabled=true;el("status").textContent="Draft · not reviewed";el("notice").textContent=""}
function render(){const square=state.mode==="square";el("widget").className="widget "+state.mode;el("ratio").textContent=square?"1:1":"9:16";el("portrait").setAttribute("aria-pressed",String(!square));el("square").setAttribute("aria-pressed",String(square));el("summary").textContent=state.intent.trim()||"Human intent powers the network.";el("modules").replaceChildren();for(const [id,name,desc] of defs){const b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",String(state.selected.has(id)));b.textContent=name;const small=document.createElement("small");small.textContent=desc;b.append(small);b.addEventListener("click",()=>{state.selected.has(id)?state.selected.delete(id):state.selected.add(id);invalidate();render()});el("modules").append(b)}}
el("portrait").onclick=()=>{state.mode="portrait";render()};el("square").onclick=()=>{state.mode="square";render()};
el("intent").addEventListener("input",e=>{state.intent=e.target.value;invalidate();el("summary").textContent=state.intent.trim()||"Human intent powers the network."});
el("review").onclick=()=>{if(!state.intent.trim()||!state.selected.size){el("notice").textContent="Enter an intent and select at least one module.";return}state.reviewed=payload();el("status").textContent="Locally reviewed · no external grant";el("copy").disabled=false;el("notice").textContent="No external action executed."};
el("copy").onclick=async()=>{if(state.reviewed!==payload())return;try{await navigator.clipboard.writeText(state.reviewed);el("notice").textContent="Copied."}catch{el("notice").textContent="Clipboard unavailable in this browser context."}};
render();
</script></body></html>
